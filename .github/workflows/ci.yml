name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:          # reused by release.yml

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: dub test (${{ matrix.os }}, ${{ matrix.dc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dc: [dmd-latest, ldc-latest]
        exclude:
          - { os: macos-latest, dc: dmd-latest }   # DMD has no Apple Silicon backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The core is private: fetch it with a read-only deploy key scoped to that repo.
      - name: Checkout AUDP-ECM core
        uses: actions/checkout@v7
        with:
          repository: SbruiceS/AUDP-ECM
          ref: dac54f1d0f9fff59991c42a5554fb73bcdb0a879   # ABI v2; bump deliberately
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          ssh-strict: true
          path: core
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Build libecm_ffi
        working-directory: core
        run: cargo build -p ecm-ffi --release --locked

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ${{ matrix.dc }}

      - name: Test and run example
        shell: bash
        run: |
          export AUDP_ECM_LIB_DIR="$GITHUB_WORKSPACE/core/target/release"
          export PATH="$AUDP_ECM_LIB_DIR:$PATH"            # Windows: find ecm_ffi.dll
          export DYLD_LIBRARY_PATH="$AUDP_ECM_LIB_DIR"     # macOS
          dub test --compiler=${DC}
          dub run :example --compiler=${DC}
